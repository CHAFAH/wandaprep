# ─────────────────────────────────────────────────────────────────────────────
# WHAT IS A REPLICASET?
#   A ReplicaSet ensures a specified number of identical Pod replicas are
#   running at all times. If a Pod crashes, the ReplicaSet creates a new one.
#   In practice you rarely create ReplicaSets directly — a Deployment manages
#   them for you and adds rolling updates and rollbacks on top.
#
# USE CASE:
#   Taught in class to show what sits underneath a Deployment. Understanding
#   ReplicaSets explains why deleting a Pod managed by a Deployment immediately
#   creates a new one — the ReplicaSet reconciles the desired state.
#
# USEFUL COMMANDS:
#   kubectl apply -f replicaset.yaml -n color-app
#   kubectl get replicaset -n color-app
#   kubectl describe replicaset color-app-replicaset -n color-app
#   # Delete a pod and watch the ReplicaSet recreate it:
#   kubectl delete pod <pod-name> -n color-app
#   kubectl get pods -n color-app -w
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: color-app-replicaset
  namespace: color-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: color-app
  template:
    metadata:
      labels:
        app: color-app
    spec:
      containers:
      - name: color-app
        image: chafah/color-app:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
