# ─────────────────────────────────────────────────────────────────────────────
# WHAT IS A ROLE?
#   A Role defines a set of permissions (verbs on resources) scoped to a
#   single namespace. It does nothing on its own — it must be bound to a
#   subject (user, group, or ServiceAccount) via a RoleBinding.
#
# USE CASE:
#   Grant color-app-sa permission to read ConfigMaps and Secrets in the
#   color-app namespace only. Nothing else. Principle of least privilege.
#
# APPLY ORDER:
#   1. kubectl apply -f serviceaccount.yaml -n color-app
#   2. kubectl apply -f role.yaml -n color-app
#   3. kubectl apply -f rolebinding.yaml -n color-app
#
# TEST IF THE ROLE WORKS (kubectl auth can-i):
#   # Should say "yes" — SA is allowed to get configmaps
#   kubectl auth can-i get configmaps -n color-app --as=system:serviceaccount:color-app:color-app-sa
#
#   # Should say "yes" — SA is allowed to list pods
#   kubectl auth can-i list pods -n color-app --as=system:serviceaccount:color-app:color-app-sa
#
#   # Should say "no" — SA cannot delete pods (not in the role)
#   kubectl auth can-i delete pods -n color-app --as=system:serviceaccount:color-app:color-app-sa
#
#   # Should say "no" — SA has no permissions in other namespaces
#   kubectl auth can-i get configmaps -n default --as=system:serviceaccount:color-app:color-app-sa
#
# USEFUL COMMANDS:
#   kubectl apply -f role.yaml -n color-app
#   kubectl get role -n color-app
#   kubectl describe role color-app-role -n color-app
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: color-app-role
  namespace: color-app
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
