# ─────────────────────────────────────────────────────────────────────────────
# WHAT IS A SERVICE ACCOUNT?
#   A ServiceAccount is an identity for a Pod. When a Pod makes API calls to
#   the Kubernetes API server it authenticates using its ServiceAccount token.
#   Every namespace has a "default" ServiceAccount — best practice is to
#   create a dedicated one per application.
#
# USE CASE:
#   color-app runs as color-app-sa instead of the default ServiceAccount.
#   We then bind a Role to this SA so only color-app Pods get those permissions
#   — not every Pod in the namespace.
#
# NOTE ON IRSA (EKS only):
#   On EKS you can annotate the ServiceAccount with an IAM role ARN so the
#   Pod gets AWS credentials automatically (no static keys). That annotation
#   is added later in the IRSA/CloudWatch lesson.
#
# USEFUL COMMANDS:
#   kubectl apply -f serviceaccount.yaml -n color-app
#   kubectl get serviceaccount -n color-app
#   kubectl describe serviceaccount color-app-sa -n color-app
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: color-app-sa
  namespace: color-app
  labels:
    app: color-app
