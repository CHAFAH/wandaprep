# ─────────────────────────────────────────────────────────────────────────────
# WHAT IS A CLUSTERROLE?
#   A ClusterRole is like a Role but cluster-wide — not scoped to a namespace.
#   Use it for resources that exist at the cluster level (nodes, namespaces,
#   persistent volumes) or when the same permissions are needed across all
#   namespaces.
#
# USE CASE:
#   A monitoring tool needs to list Pods across ALL namespaces and read node
#   info. A ClusterRole grants this once — no need to create a Role in every
#   namespace.
#
# APPLY ORDER:
#   1. kubectl apply -f serviceaccount.yaml -n color-app
#   2. kubectl apply -f clusterrole.yaml
#   3. kubectl apply -f clusterrolebinding.yaml
#
# TEST IF THE CLUSTERROLE WORKS:
#   # Should say "yes" — allowed to list pods in any namespace
#   kubectl auth can-i list pods -n kube-system --as=system:serviceaccount:color-app:color-app-sa
#
#   # Should say "yes" — allowed to list nodes (cluster-level resource)
#   kubectl auth can-i list nodes --as=system:serviceaccount:color-app:color-app-sa
#
#   # Should say "no" — delete is not in the ClusterRole
#   kubectl auth can-i delete nodes --as=system:serviceaccount:color-app:color-app-sa
#
# USEFUL COMMANDS:
#   kubectl apply -f clusterrole.yaml
#   kubectl get clusterrole color-app-cluster-reader
#   kubectl describe clusterrole color-app-cluster-reader
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: color-app-cluster-reader
rules:
- apiGroups: [""]
  resources: ["nodes", "namespaces", "pods", "services"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets", "daemonsets"]
  verbs: ["get", "list", "watch"]
