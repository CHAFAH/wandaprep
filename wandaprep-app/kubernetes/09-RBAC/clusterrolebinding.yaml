# ─────────────────────────────────────────────────────────────────────────────
# WHAT IS A CLUSTERROLEBINDING?
#   A ClusterRoleBinding attaches a ClusterRole to a subject cluster-wide.
#   The subject gets the permissions in every namespace and on cluster-level
#   resources (nodes, PVs, etc.).
#
# ROLE vs CLUSTERROLE SUMMARY:
#   Role + RoleBinding         → permissions in ONE namespace only
#   ClusterRole + ClusterRoleBinding → permissions across ALL namespaces
#   ClusterRole + RoleBinding  → ClusterRole permissions scoped to ONE namespace
#
# USE CASE:
#   Bind color-app-cluster-reader to color-app-sa so a monitoring pod running
#   as that SA can list Pods and nodes across the whole cluster.
#
# APPLY ORDER:
#   1. kubectl apply -f serviceaccount.yaml -n color-app
#   2. kubectl apply -f clusterrole.yaml
#   3. kubectl apply -f clusterrolebinding.yaml   ← this file
#
# TEST WITH kubectl auth can-i:
#   # Cluster-wide pod listing — should say "yes"
#   kubectl auth can-i list pods -n kube-system --as=system:serviceaccount:color-app:color-app-sa
#
#   # Node listing — should say "yes"
#   kubectl auth can-i list nodes --as=system:serviceaccount:color-app:color-app-sa
#
#   # Delete — should say "no"
#   kubectl auth can-i delete deployments -n color-app --as=system:serviceaccount:color-app:color-app-sa
#
# TEST FROM INSIDE THE POD (live API call):
#   kubectl exec -it color-app-clusterrole-pod -n color-app -- sh
#
#   Inside the pod — list pods in kube-system (should return pod list):
#     TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
#     wget -qO- --header="Authorization: Bearer $TOKEN" \
#       https://kubernetes.default.svc/api/v1/namespaces/kube-system/pods \
#       --no-check-certificate | head -50
#
# USEFUL COMMANDS:
#   kubectl apply -f clusterrolebinding.yaml
#   kubectl get clusterrolebinding color-app-cluster-rolebinding
#   kubectl describe clusterrolebinding color-app-cluster-rolebinding
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: color-app-cluster-rolebinding
subjects:
- kind: ServiceAccount
  name: color-app-sa
  namespace: color-app
roleRef:
  kind: ClusterRole
  name: color-app-cluster-reader
  apiGroup: rbac.authorization.k8s.io
---
# ─────────────────────────────────────────────────────────────────────────────
# Test pod — runs as color-app-sa to verify ClusterRole permissions live.
#
#   kubectl apply -f clusterrolebinding.yaml
#   kubectl exec -it color-app-clusterrole-pod -n color-app -- sh
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Pod
metadata:
  name: color-app-clusterrole-pod
  namespace: color-app
  labels:
    app: color-app
spec:
  serviceAccountName: color-app-sa
  containers:
  - name: color-app
    image: chafah/color-app:latest
    ports:
    - containerPort: 8080
