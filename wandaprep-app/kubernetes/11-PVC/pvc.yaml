# ─────────────────────────────────────────────────────────────────────────────
# WHAT IS A PERSISTENTVOLUMECLAIM?
#   A PVC is a request for storage. The cluster fulfils it by binding a
#   PersistentVolume (PV) that matches the requested size, access mode and
#   storage class. On EKS with the EBS CSI driver, a PVC with storageClassName
#   gp2 or gp3 automatically provisions an EBS volume.
#
# USE CASE:
#   Provision a dedicated EBS volume for color-app log storage on EKS.
#   The EBS CSI driver (installed by Terraform) handles the volume lifecycle.
#
# USEFUL COMMANDS:
#   kubectl apply -f pvc.yaml -n color-app
#   kubectl get pvc -n color-app
#   kubectl describe pvc color-app-logs-pvc -n color-app
#   # STATUS should move from Pending → Bound once a Pod mounts it
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: color-app-logs-pvc
  namespace: color-app
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: gp2
  resources:
    requests:
      storage: 1Gi
