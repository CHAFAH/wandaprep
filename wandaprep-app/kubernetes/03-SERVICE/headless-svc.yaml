# ─────────────────────────────────────────────────────────────────────────────
# WHAT IS A HEADLESS SERVICE?
#   clusterIP: None means no virtual IP is assigned. DNS for this service
#   returns the individual Pod IPs directly instead of a single stable IP.
#   Clients discover and connect to specific Pods rather than being load-balanced.
#
# USE CASE:
#   StatefulSets (databases, Kafka, Elasticsearch) where clients need to
#   connect to a specific Pod (e.g. the primary). Each Pod gets a stable DNS:
#   <pod-name>.<svc-name>.<namespace>.svc.cluster.local
#
# HOW TO DEMO — compare DNS behaviour vs ClusterIP:
#   kubectl apply -f headless-svc.yaml -n color-app
#
#   # Exec into the curl pod (created by clusterip-svc.yaml):
#   kubectl exec -it curl-pod -n color-app -- sh
#
#   # ClusterIP — DNS returns ONE stable IP (the virtual ClusterIP):
#   nslookup color-app-clusterip-svc.color-app.svc.cluster.local
#
#   # Headless — DNS returns MULTIPLE IPs (one per Pod):
#   nslookup color-app-headless-svc.color-app.svc.cluster.local
#
#   # Notice the difference — headless gives you all Pod IPs directly
#
# USEFUL COMMANDS:
#   kubectl get svc color-app-headless-svc -n color-app
#   # CLUSTER-IP column shows "None" — that is the headless indicator
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Pod
metadata:
  name: color-app-headless-pod
  namespace: color-app
  labels:
    app: color-app
spec:
  containers:
  - name: color-app
    image: chafah/color-app:latest
    ports:
    - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: color-app-headless-svc
  namespace: color-app
spec:
  selector:
    app: color-app
  clusterIP: None
  ports:
  - name: http
    port: 80
    targetPort: 8080
