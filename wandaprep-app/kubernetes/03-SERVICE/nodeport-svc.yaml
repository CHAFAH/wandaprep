# ─────────────────────────────────────────────────────────────────────────────
# WHAT IS A NODEPORT SERVICE?
#   NodePort exposes the service on a static port (30000–32767) on every node.
#   Traffic to <NodeIP>:<nodePort> is forwarded to the matching Pods.
#   No cloud load balancer needed — works on any cluster including minikube.
#
# USE CASE:
#   Access color-app from your browser on a local or bare-metal cluster
#   without a cloud load balancer.
#
# HOW TO DEMO:
#   kubectl apply -f nodeport-svc.yaml -n color-app
#
#   # Get the node IP:
#   kubectl get nodes -o wide
#
#   # Open in browser:
#   http://<NODE-IP>:31200
#
#   # On minikube — opens the browser automatically:
#   minikube service color-app-nodeport-svc -n color-app
#
#   # On EKS — get a node's external IP and hit port 31200:
#   kubectl get nodes -o wide   # copy EXTERNAL-IP
#   curl http://<EXTERNAL-IP>:31200/health
#
# USEFUL COMMANDS:
#   kubectl get svc color-app-nodeport-svc -n color-app
#   kubectl describe svc color-app-nodeport-svc -n color-app
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Pod
metadata:
  name: color-app-nodeport-pod
  namespace: color-app
  labels:
    app: color-app
spec:
  containers:
  - name: color-app
    image: chafah/color-app:latest
    ports:
    - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: color-app-nodeport-svc
  namespace: color-app
spec:
  selector:
    app: color-app
  type: NodePort
  ports:
  - name: http
    port: 80
    targetPort: 8080
    nodePort: 31200
