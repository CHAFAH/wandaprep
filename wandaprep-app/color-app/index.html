<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WANDAPREP App</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background-color: {{APP_COLOR}};
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }
        h1 { font-size: 2.8em; margin-bottom: 10px; }
        .subtitle { font-size: 1.2em; opacity: 0.85; margin-bottom: 40px; }
        .card {
            background: rgba(0,0,0,0.25);
            border-radius: 12px;
            padding: 30px 40px;
            max-width: 600px;
            width: 100%;
        }
        .card h2 { font-size: 1.1em; text-transform: uppercase; letter-spacing: 2px; opacity: 0.7; margin-bottom: 20px; }
        .row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.15); }
        .row:last-child { border-bottom: none; }
        .label { opacity: 0.75; font-size: 0.95em; }
        .value { font-weight: bold; font-size: 0.95em; }
        .source { font-size: 0.75em; opacity: 0.55; margin-top: 2px; }
        .clock { margin-top: 30px; font-size: 1em; opacity: 0.7; }
    </style>
</head>
<body>
    <h1>WANDAPREP</h1>
    <p class="subtitle">Kubernetes Training Application</p>

    <div class="card">
        <h2>Runtime Configuration</h2>

        <div class="row">
            <div>
                <div class="label">Background Color</div>
                <div class="source">from ConfigMap → APP_COLOR</div>
            </div>
            <div class="value">{{APP_COLOR}}</div>
        </div>

        <div class="row">
            <div>
                <div class="label">Environment</div>
                <div class="source">from ConfigMap → APP_ENV</div>
            </div>
            <div class="value">{{APP_ENV}}</div>
        </div>

        <div class="row">
            <div>
                <div class="label">Message</div>
                <div class="source">from ConfigMap → APP_MESSAGE</div>
            </div>
            <div class="value">{{APP_MESSAGE}}</div>
        </div>

        <div class="row">
            <div>
                <div class="label">Secret Key</div>
                <div class="source">from Secret → SECRET_KEY</div>
            </div>
            <div class="value">{{SECRET_KEY}}</div>
        </div>
    </div>

    <div class="clock" id="clock"></div>

    <script>
        function tick() {
            document.getElementById('clock').textContent = new Date().toLocaleString();
        }
        setInterval(tick, 1000);
        tick();
    </script>
</body>
</html>
