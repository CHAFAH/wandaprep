kind: Service
apiVersion: v1
metadata:
  name: color-app-clusterip-svc
  namespace: color-app
spec:
  selector:
    app: color-app
  type: ClusterIP
  ports:
  - name: tcp
    port:  80
    targetPort:  8080
---

kind: Service
apiVersion: v1
metadata:
  name: color-app-nodeport-svc
  namespace:  color-app
spec:
  selector:
    app: color-app
  type: NodePort
  ports:
  - name:  http
    port:  80
    targetPort: 8080
    nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: color-app-lb-svc
  namespace: color-app
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: external
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  selector:
    app: color-app
  type: LoadBalancer
  ports:
  - name: http
    port: 80
    targetPort: 8080
