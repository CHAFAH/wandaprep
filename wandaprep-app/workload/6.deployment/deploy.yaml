apiVersion: apps/v1
kind: Deployment
metadata:
  name: color-app-deployment
  namespace: color-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: color-app
  template:
    metadata:
      labels:
        app: color-app
    spec:
      containers:
      - name: color-app
        image: 211125430491.dkr.ecr.us-east-1.amazonaws.com/color-app:v1.0
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: color-app-config
        - secretRef:
            name: color-secret
