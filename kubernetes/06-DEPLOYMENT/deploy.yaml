# ─────────────────────────────────────────────────────────────────────────────
# WHAT IS A DEPLOYMENT?
#   A Deployment manages a ReplicaSet and ensures a desired number of Pod
#   replicas are always running. It handles rolling updates and rollbacks
#   automatically — if you push a bad image, you can roll back with one command.
#
# USE CASE:
#   Run 3 replicas of color-app so the app stays available if a node goes down.
#   When you push a new image tag, the Deployment rolls it out one Pod at a
#   time with zero downtime, then lets you roll back if something breaks.
#
# USEFUL COMMANDS:
#   kubectl apply -f deploy.yaml -n wandaprep
#   kubectl get deployments -n wandaprep
#   kubectl rollout status deployment/wandaprep-deployment -n wandaprep
#   kubectl rollout history deployment/wandaprep-deployment -n wandaprep
#   kubectl rollout undo deployment/wandaprep-deployment -n wandaprep
#   kubectl scale deployment wandaprep-deployment --replicas=5 -n wandaprep
#   kubectl set image deployment/wandaprep-deployment wandaprep-app=chafah/wandaprep-app:v2.0 -n wandaprep
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wandaprep-deployment
  namespace: wandaprep
spec:
  replicas: 3
  selector:
    matchLabels:
      app: wandaprep-app
  template:
    metadata:
      labels:
        app: wandaprep-app
    spec:
      serviceAccountName: wandaprep-sa
      containers:
      - name: wandaprep-app
        image: chafah/wandaprep-app:latest
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: wandaprep-config
        env:
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: wandaprep-secret
              key: SECRET_KEY
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
