# ─────────────────────────────────────────────────────────────────────────────
# WHAT IS A ROLEBINDING?
#   A RoleBinding attaches a Role to a subject (ServiceAccount, user, or group)
#   within a namespace. It is the glue between "what permissions exist" (Role)
#   and "who gets them" (subject).
#
# USE CASE:
#   Bind color-app-role to color-app-sa so any Pod running as color-app-sa
#   can read ConfigMaps, Secrets, and Pods in the color-app namespace.
#
# APPLY ORDER:
#   1. kubectl apply -f serviceaccount.yaml -n color-app
#   2. kubectl apply -f role.yaml -n color-app
#   3. kubectl apply -f rolebinding.yaml -n color-app   ← this file
#
# TEST WITH kubectl auth can-i (no pod needed):
#   kubectl auth can-i get configmaps -n color-app --as=system:serviceaccount:color-app:color-app-sa
#   kubectl auth can-i delete pods    -n color-app --as=system:serviceaccount:color-app:color-app-sa
#
# TEST FROM INSIDE A POD (live API call using the mounted SA token):
#   kubectl exec -it color-app-rbac-pod -n color-app -- sh
#
#   Inside the pod — these should succeed:
#     wget -qO- --header="Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" \
#       https://kubernetes.default.svc/api/v1/namespaces/color-app/configmaps \
#       --no-check-certificate
#
#   Inside the pod — this should return 403 Forbidden (delete not allowed):
#     wget -qO- --header="Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" \
#       --method=DELETE \
#       https://kubernetes.default.svc/api/v1/namespaces/color-app/pods/some-pod \
#       --no-check-certificate
#
# USEFUL COMMANDS:
#   kubectl apply -f rolebinding.yaml -n color-app
#   kubectl get rolebinding -n color-app
#   kubectl describe rolebinding color-app-rolebinding -n color-app
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: color-app-rolebinding
  namespace: color-app
subjects:
- kind: ServiceAccount
  name: color-app-sa
  namespace: color-app
roleRef:
  kind: Role
  name: color-app-role
  apiGroup: rbac.authorization.k8s.io
---
# ─────────────────────────────────────────────────────────────────────────────
# Test pod — runs as color-app-sa so you can exec in and make live API calls
# to prove the Role and RoleBinding are working.
#
#   kubectl apply -f rolebinding.yaml -n color-app
#   kubectl exec -it color-app-rbac-pod -n color-app -- sh
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Pod
metadata:
  name: color-app-rbac-pod
  namespace: color-app
  labels:
    app: color-app
spec:
  serviceAccountName: color-app-sa
  containers:
  - name: color-app
    image: chafah/color-app:latest
    ports:
    - containerPort: 8080
